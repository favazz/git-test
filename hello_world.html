<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-1: #8b5cf6;
      --accent-2: #ec4899;
      --accent-3: #3b82f6;
      --glow-1: rgba(139, 92, 246, 0.35);
      --glow-2: rgba(236, 72, 153, 0.35);
    }

    [data-theme="cyber"] {
      --accent-1: #00f2fe;
      --accent-2: #4facfe;
      --accent-3: #10b981;
      --glow-1: rgba(0, 242, 254, 0.35);
      --glow-2: rgba(79, 172, 254, 0.35);
    }

    [data-theme="aurora"] {
      --accent-1: #10b981;
      --accent-2: #06b6d4;
      --accent-3: #84cc16;
      --glow-1: rgba(16, 185, 129, 0.35);
      --glow-2: rgba(6, 182, 212, 0.35);
    }

    [data-theme="sunset"] {
      --accent-1: #f97316;
      --accent-2: #ef4444;
      --accent-3: #f59e0b;
      --glow-1: rgba(249, 115, 22, 0.35);
      --glow-2: rgba(239, 68, 68, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Interactive Canvas Background */
    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;  
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Ambient Pulsing Glow Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      opacity: 0.5;
      animation: floatOrb 14s infinite ease-in-out alternate;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, var(--accent-1) 0%, transparent 70%);
      top: -100px;
      left: -100px;
    }

    .orb-2 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, var(--accent-2) 0%, transparent 70%);
      bottom: -150px;
      right: -100px;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, var(--accent-3) 0%, transparent 70%);
      top: 40%;
      left: 60%;
      animation-delay: -9s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.15); }
      100% { transform: translate(-40px, 80px) scale(0.95); }
    }

    /* Container & 3D Tilt Card */
    .card-wrapper {
      position: relative;
      z-index: 2;
      perspective: 1000px;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 56px 64px;
      max-width: 680px;
      text-align: center;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.5),
        0 0 100px var(--glow-1),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: transform 0.15s ease-out, box-shadow 0.3s ease, border-color 0.3s ease;
      transform-style: preserve-3d;
    }

    /* Subtle Animated Border Gradient */
    .card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 34px;
      padding: 2px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2), transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .card:hover::before {
      opacity: 1;
    }

    /* Pill Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #e2e8f0;
      margin-bottom: 28px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Typography */
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 4.5rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ffffff 10%, var(--accent-1) 50%, var(--accent-2) 90%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineGrad 7s linear infinite;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    @keyframes shineGrad {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }

    .tagline {
      font-size: 1.15rem;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 460px;
      margin: 0 auto 36px;
      font-weight: 300;
    }

    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--accent-1);
      margin-left: 4px;
      vertical-align: middle;
      animation: blinkCursor 0.8s infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Actions and Buttons */
    .button-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .btn {
      position: relative;
      padding: 14px 28px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: white;
      box-shadow: 0 10px 25px var(--glow-1);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px var(--glow-1);
      filter: brightness(1.1);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    /* Theme Switcher Pills */
    .theme-selector {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .theme-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 2px solid transparent;
    }

    .theme-dot:hover {
      transform: scale(1.25);
    }

    .theme-dot.active {
      border-color: white;
      transform: scale(1.15);
    }

    .theme-purple { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
    .theme-cyber { background: linear-gradient(135deg, #00f2fe, #4facfe); }
    .theme-aurora { background: linear-gradient(135deg, #10b981, #06b6d4); }
    .theme-sunset { background: linear-gradient(135deg, #f97316, #ef4444); }

    /* Floating Toast notification */
    .toast {
      position: fixed;
      bottom: 30px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 12px 24px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .card {
        padding: 40px 24px;
        border-radius: 24px;
      }
      h1 {
        font-size: 3rem;
      }
      .tagline {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Light Orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Interactive Star/Particle Canvas -->
  <canvas id="particleCanvas"></canvas>

  <!-- Interactive 3D Tilt Card -->
  <div class="card-wrapper" id="cardWrapper">
    <div class="card" id="tiltCard">
      
      <div class="badge">
        <span class="badge-dot"></span>
        <span id="liveTime">SYSTEM ONLINE</span>
      </div>

      <h1>Hello, World.</h1>

      <p class="tagline">
        <span id="typewriter"></span><span class="typewriter-cursor"></span>
      </p>

      <div class="button-group">
        <button class="btn btn-primary" id="celebrateBtn">
          <span>✨ Celebrate</span>
        </button>
        <button class="btn btn-secondary" id="soundBtn">
          <span>👋 Say Hello</span>
        </button>
      </div>

      <div class="theme-selector">
        <span style="font-size: 0.75rem; color: #64748b; margin-right: 4px; font-weight: 600;">THEME</span>
        <div class="theme-dot theme-purple active" title="Cosmic Purple" data-set-theme="default"></div>
        <div class="theme-dot theme-cyber" title="Cyber Cyan" data-set-theme="cyber"></div>
        <div class="theme-dot theme-aurora" title="Aurora Emerald" data-set-theme="aurora"></div>
        <div class="theme-dot theme-sunset" title="Sunset Gold" data-set-theme="sunset"></div>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span id="toastIcon">✨</span>
    <span id="toastMessage">Hello! Hope you have an incredible day.</span>
  </div>

  <script>
    // 1. Live Time Indicator
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById('liveTime').textContent = `SYSTEM ONLINE · ${timeStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Typewriter Effect
    const phrases = [
      "Crafted with elegance and modern aesthetic.",
      "Designed to inspire extraordinary ideas.",
      "A brand-new chapter starts right here.",
      "Welcome to your creative workspace."
    ];
    let phraseIdx = 0;
    let charIdx = 0;
    let isDeleting = false;
    const typewriterEl = document.getElementById('typewriter');

    function typeLoop() {
      const current = phrases[phraseIdx];
      if (isDeleting) {
        typewriterEl.textContent = current.substring(0, charIdx - 1);
        charIdx--;
      } else {
        typewriterEl.textContent = current.substring(0, charIdx + 1);
        charIdx++;
      }

      let speed = isDeleting ? 30 : 65;

      if (!isDeleting && charIdx === current.length) {
        speed = 2200;
        isDeleting = true;
      } else if (isDeleting && charIdx === 0) {
        isDeleting = false;
        phraseIdx = (phraseIdx + 1) % phrases.length;
        speed = 400;
      }
      setTimeout(typeLoop, speed);
    }
    typeLoop();

    // 3. 3D Card Tilt Effect on Mouse Move
    const cardWrapper = document.getElementById('cardWrapper');
    const tiltCard = document.getElementById('tiltCard');

    window.addEventListener('mousemove', (e) => {
      const rect = tiltCard.getBoundingClientRect();
      const cardX = rect.left + rect.width / 2;
      const cardY = rect.top + rect.height / 2;
      
      const mouseX = e.clientX - cardX;
      const mouseY = e.clientY - cardY;

      const rotateX = (mouseY / (rect.height / 2)) * -9;
      const rotateY = (mouseX / (rect.width / 2)) * 9;

      tiltCard.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    window.addEventListener('mouseleave', () => {
      tiltCard.style.transform = `rotateX(0deg) rotateY(0deg)`;
    });

    // 4. Interactive Particle Canvas
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.8;
        this.baseX = this.x;
        this.baseY = this.y;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.alpha = Math.random() * 0.6 + 0.2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }

        // Mouse interaction
        if (mouse.x !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            const force = (120 - dist) / 120;
            this.x -= (dx / dist) * force * 3;
            this.y -= (dy / dist) * force * 3;
          }
        }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 75; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 5. Confetti Burst on Celebrate Button
    const celebrateBtn = document.getElementById('celebrateBtn');
    let confetti = [];

    function burstConfetti() {
      const colors = ['#8b5cf6', '#ec4899', '#3b82f6', '#10b981', '#f59e0b', '#ffffff'];
      const rect = celebrateBtn.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top;

      for (let i = 0; i < 90; i++) {
        confetti.push({
          x: originX,
          y: originY,
          vx: (Math.random() - 0.5) * 14,
          vy: Math.random() * -12 - 4,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 18,
          alpha: 1
        });
      }
      showToast("🎉 Celebrations! Welcome to Hello World!", "🚀");
    }

    celebrateBtn.addEventListener('click', burstConfetti);

    function updateConfetti() {
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.35; // gravity
        c.rotation += c.rotationSpeed;
        c.alpha -= 0.012;

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate((c.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(c.alpha, 0);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
        ctx.restore();

        if (c.alpha <= 0 || c.y > canvas.height) {
          confetti.splice(i, 1);
        }
      }
      requestAnimationFrame(updateConfetti);
    }
    updateConfetti();

    // 6. Say Hello / Sound Button
    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      // Gentle synthetic audio chime using Web Audio API
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C, E, G, High C
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + idx * 0.1 + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.1);
          osc.stop(audioCtx.currentTime + idx * 0.1 + 0.5);
        });
      } catch (err) {}
      showToast("Hello, Traveler! Have a wonderful day.", "👋");
    });

    // 7. Toast Functionality
    const toast = document.getElementById('toast');
    let toastTimeout;
    function showToast(message, icon = "✨") {
      document.getElementById('toastMessage').textContent = message;
      document.getElementById('toastIcon').textContent = icon;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    // 8. Theme Switcher
    const themeDots = document.querySelectorAll('.theme-dot');
    themeDots.forEach(dot => {
      dot.addEventListener('click', () => {
        themeDots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        const theme = dot.getAttribute('data-set-theme');
        if (theme === 'default') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
      });
    });
  </script>
</body>
</html>
